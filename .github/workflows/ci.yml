name: sigma-themes QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-and-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate release file layout
        run: node scripts/check-release-layout.mjs
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run Node API and SSEQ tests
        run: npm test
      - name: Verify issue ledger
        run: node scripts/check-known-issues.mjs
      - name: SSEQ pack and browser-codec Node validation
        run: npm run test:sseq
      - name: Validate synthetic SSEQ example ZIP
        run: |
          npm run test:example
          node scripts/validate-sigma-dex-pack.mjs examples/sigma-dex-example-music.zip
      - name: Browser-runner timeout and subprocess cleanup regression
        run: python3 tests/test_runner_timeout.py
  browser:
    name: Browser ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - browser_public.py
          - browser_sseq_upload_pipeline.py
          - browser_upload_dialog.py
          - browser_catalog_integrity.py
          - browser_sprite_visibility.py
          - browser_sigma_export.py
          - browser_sseq_conversion.py
          - browser_sseq_player.py
          - browser_transcription_worker.py
          - browser_status.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run isolated browser regression with bounded runtime
        env:
          SIGMA_BROWSER_USE_REAL_CRYPTO: '1'
        run: timeout 90s python -u tests/${{ matrix.suite }}
