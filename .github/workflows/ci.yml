name: sigma-themes QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-and-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static analysis, API tests and ledger verification
        run: npm run verify
      - name: FFmpeg DS codec validation
        run: npm run test:ffmpeg
      - name: Browser-runner timeout and subprocess cleanup regression
        run: python3 tests/test_runner_timeout.py
  browser:
    name: Browser ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - browser_public.py
          - browser_upload_cancel.py
          - browser_exports.py
          - browser_catalog_integrity.py
          - browser_qc5.py
          - browser_qc7.py
          - browser_sprite_visibility.py
          - browser_sigma_export.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run isolated browser regression with bounded runtime
        run: timeout 90s python -u tests/${{ matrix.suite }}
