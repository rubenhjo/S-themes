name: sigma-themes staging smoke (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      SIGMA_STAGING_URL: ${{ vars.SIGMA_STAGING_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Exercise real public staging API without writing to database
        run: python tests/staging_smoke.py
